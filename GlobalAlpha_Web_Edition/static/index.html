        "default":{"北美":{currency:"USD",mid_range:"80-500",top:[["Leading Brand A","299"],["Leading Brand B","149"]]},"欧洲":{currency:"EUR",mid_range:"60-400",top:[["EU Brand","199"]]},"东南亚":{currency:"USD",mid_range:"30-200",top:[["Local Brand","89"]]}}
    };

    function getPricing(category) {
        for (const [key, val] of Object.entries(PRICING_TEMPLATES)) {
            if (category.includes(key)) return val;
        }
        return PRICING_TEMPLATES["default"];
    }

    function getHsCode(category) {
        for (const [key, val] of Object.entries(HS_CODES)) {
            if (category.includes(key)) return val;
        }
        return "999999";
    }

    function getCompliance(category) {
        const matches = COMPLIANCE_DB.filter(item =>
            category.split('').some(ch => item.category.includes(ch)) ||
            item.category.split('').some(ch => category.includes(ch)) ||
            category.includes(item.category) || item.category.includes(category)
        );
        return matches.length > 0 ? matches : [{
            category: category,
            reason: "建议在进入目标市场前，详细研究目的地国对该类产品的准入标准及认证要求。",
            suggestion: "建议委托专业贸易合规机构进行市场准入评估，制定专属合规路径。",
            breakthrough: "积极寻找当地代理商，结合本地化需求调整产品定位，快速切入细分市场。"
        }];
    }

    function computeCompass(category) {
        const scored = COUNTRIES_DB.map(c => {
            let score = (c.gdp_per_capita / 10000) + (c.pop / 60) + (c.growth * 1.5) + (c.infra * 0.5);
            return {...c, score};
        });

        const byGdp = [...scored].sort((a,b) => b.gdp_per_capita - a.gdp_per_capita);
        const byPop = [...scored].sort((a,b) => b.pop - a.pop);
        const byScore = [...scored].sort((a,b) => b.score - a.score);

        return {
            profit_market: byGdp.slice(0, 3),
            mass_market: byPop.slice(0, 2),
            blue_ocean: byScore.filter(c => c.gdp_per_capita < 20000).slice(0, 3)
        };
    }

    // ========== Render ==========
    function renderCountryCard(c) {
        return '<div class="card p-4 rounded-xl">' +
            '<div class="font-bold text-base">' + c.name + '</div>' +
            '<div class="text-xs text-gray-400 mt-1">' + c.region + '</div>' +
            '<div class="text-xs text-gray-300 mt-2">GDP: $' + (c.gdp_per_capita/1000).toFixed(0) + 'k | 增速: ' + c.growth + '%</div>' +
        '</div>';
    }

    function renderIntel(category) {
        const recs = computeCompass(category);
        const compliance = getCompliance(category);
        const pricing = getPricing(category);
        const hsCode = getHsCode(category);

        // Countries
        document.getElementById('profit-list').innerHTML = recs.profit_market.map(renderCountryCard).join('');
        document.getElementById('mass-list').innerHTML = recs.mass_market.map(renderCountryCard).join('');
        document.getElementById('blue-list').innerHTML = recs.blue_ocean.map(renderCountryCard).join('');

        // Compliance
        const item = compliance[0];
        document.getElementById('compliance-content').innerHTML =
            '<div class="border-r border-white/10 pr-8">' +
                '<h3 class="text-blue-400 font-bold mb-3">准入红线</h3>' +
                '<p class="text-gray-300 text-sm leading-relaxed">' + item.reason + '</p>' +
                '<p class="text-gray-300 text-sm leading-relaxed mt-3">' + item.suggestion + '</p>' +
            '</div>' +
            '<div>' +
                '<h3 class="text-green-400 font-bold mb-3">出海突破口</h3>' +
                '<p class="text-gray-300 text-sm leading-relaxed italic">' + item.breakthrough + '</p>' +
            '</div>';

        // Pricing
        const pricingHtml = Object.entries(pricing).map(function(entry) {
            const region = entry[0], info = entry[1];
            const products = info.top.map(p => '<div>• ' + p[0] + ' (' + info.currency + p[1] + ')</div>').join('');
            return '<div class="card p-5 rounded-2xl">' +
                '<div class="text-xs text-blue-400 font-bold mb-2">' + region + '</div>' +
                '<div class="text-2xl font-bold mb-3">' + info.currency + ' ' + info.mid_range + '</div>' +
                '<div class="text-xs text-gray-400 space-y-1">' + products + '</div>' +
            '</div>';
        }).join('');
        document.getElementById('pricing-grid').innerHTML = pricingHtml;

        // Customs
        document.getElementById('customs-content').innerHTML =
            '<div>' +
                '<h3 class="text-gray-400 text-sm mb-2">HS Code</h3>' +
                '<div class="text-3xl font-bold text-blue-300">' + hsCode + '</div>' +
                '<div class="text-xs text-green-400 mt-2">出口额同比增速 +8~15%</div>' +
            '</div>' +
            '<div class="border-x border-white/10 px-8">' +
                '<h3 class="text-gray-400 text-sm mb-2">风险预警</h3>' +
                '<div class="text-xs text-red-400 space-y-1">' +
                    '<div>• 欧盟新法规更新（2025）</div>' +
                    '<div>• 美国 301 关税波动</div>' +
                    '<div>• 目标市场认证要求变化</div>' +
                '</div>' +
            '</div>' +
            '<div>' +
                '<h3 class="text-gray-400 text-sm mb-2">主要市场关税</h3>' +
                '<div class="text-sm space-y-2">' +
                    '<div class="flex justify-between"><span class="text-gray-400">美国</span><span>7.5~25%</span></div>' +
                    '<div class="flex justify-between"><span class="text-gray-400">欧盟</span><span>2.7~6.5%</span></div>' +
                    '<div class="flex justify-between"><span class="text-gray-400">东南亚</span><span>0~5%</span></div>' +
                '</div>' +
            '</div>';

        document.getElementById('results').classList.remove('hidden');
        document.getElementById('compliance-section').classList.remove('hidden');
        document.getElementById('pricing-section').classList.remove('hidden');
        document.getElementById('customs-section').classList.remove('hidden');
        document.getElementById('download-section').classList.remove('hidden');
        document.getElementById('loading').classList.add('hidden');

        window.scrollTo({top: document.getElementById('results').offsetTop - 100, behavior: 'smooth'});
    }

    // ========== Main Actions ==========
    async function runCompass() {
        const cat = document.getElementById('search-input').value.trim();
        if (!cat) return;

        document.getElementById('loading').classList.remove('hidden');
        document.getElementById('results').classList.add('hidden');
        document.getElementById('compliance-section').classList.add('hidden');
        document.getElementById('pricing-section').classList.add('hidden');
        document.getElementById('customs-section').classList.add('hidden');
        document.getElementById('download-section').classList.add('hidden');

        // Try API first, fall back to local
        try {
            const res = await fetch('/api/intel?category=' + encodeURIComponent(cat));
            if (!res.ok) throw new Error('no backend');
            const data = await res.json();
            // Inject API data into renderIntel override
            renderIntelFromApi(data);
        } catch(e) {
            // Pure standalone mode — no backend needed
            setTimeout(() => renderIntel(cat), 300);
        }
    }

    function renderIntelFromApi(data) {
        // Same as renderIntel but uses API response format
        if (data.recommendations) {
            document.getElementById('profit-list').innerHTML = data.recommendations.profit_market.map(renderCountryCard).join('');
            document.getElementById('mass-list').innerHTML = data.recommendations.mass_market.map(renderCountryCard).join('');
            document.getElementById('blue-list').innerHTML = data.recommendations.blue_ocean.map(renderCountryCard).join('');
        }
        document.getElementById('results').classList.remove('hidden');
        document.getElementById('download-section').classList.remove('hidden');
        document.getElementById('loading').classList.add('hidden');
    }

    async function downloadReport() {
        const cat = document.getElementById('search-input').value.trim();
        if (!cat) return;
        alert('PDF 报告生成功能需要后端服务支持。\n\n当前为静态演示模式，完整部署后可自动生成麦肯锡风格调研报告。');
    }

    async function fetchTeamReports() {
        const query = document.getElementById('report-search').value;
        try {
            const res = await fetch('/api/team/reports?query=' + encodeURIComponent(query));
            if (!res.ok) throw new Error();
            const data = await res.json();
            const lib = document.getElementById('reports-library');
            if (!data.length) {
                lib.innerHTML = '<div class="col-span-full text-center py-12 text-gray-500">生成报告后将在此共享</div>';
                return;
            }
            lib.innerHTML = data.map(r =>
                '<div class="card p-5 rounded-2xl flex justify-between items-center">' +
                    '<div><div class="font-bold text-blue-400 mb-1">' + r.category + '</div>' +
                    '<div class="text-xs text-gray-500">' + r.created_at + '</div></div>' +
                    '<a href="/reports/' + r.filename + '" target="_blank" class="text-2xl">📄</a>' +
                '</div>'
            ).join('');
        } catch(e) {
            // No backend — keep default message
        }
    }

    async function fetchMarket() {
        try {
            const res = await fetch('/api/market');
            if (!res.ok) throw new Error();
            const data = await res.json();
            document.getElementById('gold-price').innerText = '伦敦金: $' + data.gold.price + ' (' + data.gold.change + '%)';
            document.getElementById('fx-rates').innerText = 'USD/CNY: ' + data.forex[0].rate.toFixed(4) + ' | EUR/CNY: ' + data.forex[1].rate.toFixed(4);
        } catch(e) {
            document.getElementById('gold-price').innerText = '伦敦金: $3,342.50 (+0.4%)';
            document.getElementById('fx-rates').innerText = 'USD/CNY: 7.2651 | EUR/CNY: 7.8432';
        }
    }

    // Init
    fetchMarket();
    fetchTeamReports();
    setInterval(fetchMarket, 60000);

    // Enter key support
    document.addEventListener('DOMContentLoaded', function() {
        document.getElementById('search-input').addEventListener('keydown', function(e) {
            if (e.key === 'Enter') runCompass();
        });
    });
    </script>
</body>
</html>
