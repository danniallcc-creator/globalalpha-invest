<!DOCTYPE html>
<html lang="zh">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>跨境出海智库 - 全球 80% 消费地图罗盘</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <style>
        .gradient-bg { background: linear-gradient(135deg, #1A2B3C 0%, #2C3E50 100%); }
        .card { backdrop-filter: blur(10px); background: rgba(255, 255, 255, 0.05); border: 1px solid rgba(255, 255, 255, 0.1); }
        .chat-window { display: none; }
    </style>
</head>
<body class="gradient-bg text-white min-h-screen font-sans">
    <!-- Ticker Bar -->
    <div id="ticker" class="bg-black/40 py-2 px-6 flex justify-between items-center text-sm border-b border-white/10">
        <div class="flex gap-4">
            <span id="gold-price" class="text-yellow-400">加载中...</span>
            <span id="fx-rates"></span>
        </div>
        <div id="last-update" class="text-gray-400 text-xs"></div>
    </div>

    <main class="max-w-6xl mx-auto p-8">
        <header class="text-center mb-12">
            <h1 class="text-4xl font-bold mb-4">全球 80% 消费地图罗盘</h1>
            <p class="text-gray-400">基于大数据算法，一键匹配全球利润、规模与蓝海市场</p>
        </header>

        <!-- Search Section -->
        <div class="max-w-2xl mx-auto mb-16 relative">
            <input id="search-input" type="text" placeholder="输入产品类目（如：户外储能）" class="w-full bg-white/10 border border-white/20 rounded-full py-4 px-8 focus:outline-none focus:ring-2 focus:ring-blue-500 text-lg">
            <button onclick="runCompass()" class="absolute right-2 top-2 bg-blue-600 hover:bg-blue-700 text-white rounded-full px-8 py-2 transition-all">开启罗盘</button>
        </div>

        <!-- Result Matrix -->
        <div id="results" class="grid grid-cols-1 md:grid-cols-3 gap-8 mb-16 hidden">
            <!-- Profit Market -->
            <div class="card p-6 rounded-2xl">
                <div class="flex items-center gap-3 mb-4">
                    <div class="bg-green-500/20 p-2 rounded-lg text-green-400">💎</div>
                    <h2 class="text-xl font-semibold">首选利润国</h2>
                </div>
                <div id="profit-list" class="space-y-4"></div>
            </div>
            <!-- Mass Market -->
            <div class="card p-6 rounded-2xl">
                <div class="flex items-center gap-3 mb-4">
                    <div class="bg-blue-500/20 p-2 rounded-lg text-blue-400">🌊</div>
                    <h2 class="text-xl font-semibold">首选规模国</h2>
                </div>
                <div id="mass-list" class="space-y-4"></div>
            </div>
            <!-- Blue Ocean -->
            <div class="card p-6 rounded-2xl">
                <div class="flex items-center gap-3 mb-4">
                    <div class="bg-purple-500/20 p-2 rounded-lg text-purple-400">🚀</div>
                    <h2 class="text-xl font-semibold">首选蓝海国</h2>
                </div>
                <div id="blue-list" class="space-y-4"></div>
            </div>
        </div>

        <!-- Compliance Section -->
        <div id="compliance-section" class="card p-8 rounded-2xl mb-16 hidden">
            <h2 class="text-2xl font-bold mb-6 flex items-center gap-3">
                <span>🛡️</span> 行业合规转型建议
            </h2>
            <div id="compliance-content" class="grid md:grid-cols-2 gap-8"></div>
        </div>

        <!-- TikTok Video Feed -->
        <div id="tiktok-feed" class="mb-16">
            <h2 class="text-2xl font-bold mb-6 flex items-center gap-3">
                <span>🎥</span> TikTok 实时热门视频
            </h2>
            <div id="video-grid" class="grid grid-cols-1 sm:grid-cols-2 md:grid-cols-3 gap-6">
                <!-- Videos will be injected here -->
            </div>
        </div>

        <!-- Local E-commerce Section -->
        <div id="ecom-feed" class="mb-16">
            <h2 class="text-2xl font-bold mb-6 flex items-center gap-3">
                <span>🛒</span> 全球本土电商爆款
            </h2>
            <div id="ecom-grid" class="grid grid-cols-1 md:grid-cols-3 gap-8">
                <!-- Regions will be injected here -->
            </div>
        </div>
    </main>

    <!-- AI Chat Floating Button -->
    <div class="fixed bottom-8 right-8 z-50">
        <button onclick="toggleChat()" class="bg-blue-600 w-16 h-16 rounded-full shadow-xl flex items-center justify-center text-3xl hover:scale-110 transition-transform">💬</button>
        <div id="chat-box" class="chat-window absolute bottom-20 right-0 w-80 bg-gray-900 border border-white/20 rounded-2xl shadow-2xl overflow-hidden flex flex-col h-[450px]">
            <div class="bg-blue-600 p-4 font-bold flex justify-between">
                <span>AI 智库助手</span>
                <button onclick="toggleChat()">×</button>
            </div>
            <div id="chat-messages" class="flex-1 p-4 overflow-y-auto space-y-4 text-sm scrollbar-hide">
                <div class="bg-white/10 p-3 rounded-lg">您好！我是您的出海助手。您可以问我任何关于行业合规或选品趋势的问题。</div>
            </div>
            <div class="p-4 bg-black/20 flex gap-2">
                <input id="chat-input" type="text" placeholder="输入问题..." class="flex-1 bg-white/10 rounded-lg px-3 py-2 outline-none">
                <button onclick="sendMessage()" class="bg-blue-600 px-4 py-2 rounded-lg">发送</button>
            </div>
        </div>
    </div>

    <script>
        const API_BASE = "http://localhost:8000/api";

        async function fetchMarket() {
            try {
                const res = await fetch(`${API_BASE}/market`);
                const data = await res.json();
                document.getElementById('gold-price').innerText = `伦敦金: $${data.gold.price} (${data.gold.change || '+0.5%'})`;
                document.getElementById('fx-rates').innerHTML = data.forex.slice(0, 3).map(f => `<span>${f.pair}: ${f.rate.toFixed(2)}</span>`).join(' | ');
                document.getElementById('last-update').innerText = `更新时间: ${new Date(data.last_update).toLocaleString()}`;
            } catch (e) { console.error(e); }
        }

        async function runCompass() {
            const cat = document.getElementById('search-input').value;
            if (!cat) return;
            const res = await fetch(`${API_BASE}/compass?category=${cat}`);
            const data = await res.json();
            
            document.getElementById('results').classList.remove('hidden');
            const renderList = (id, list) => {
                document.getElementById(id).innerHTML = list.map(c => `
                    <div class="bg-white/5 p-4 rounded-xl">
                        <div class="font-bold text-lg">${c.name}</div>
                        <p class="text-sm text-gray-400 mt-1">GDP: $${(c.gdp_per_capita/1000).toFixed(1)}k | 增速: ${c.growth}%</p>
                    </div>
                `).join('');
            };
            renderList('profit-list', data.recommendations.profit_market);
            renderList('mass-list', data.recommendations.mass_market);
            renderList('blue-list', data.recommendations.blue_ocean);

            // Fetch Compliance
            const cRes = await fetch(`${API_BASE}/compliance?q=${cat.slice(0,2)}`);
            const cData = await cRes.json();
            if (cData.length > 0) {
                document.getElementById('compliance-section').classList.remove('hidden');
                const item = cData[0];
                document.getElementById('compliance-content').innerHTML = `
                    <div class="border-r border-white/10 pr-8">
                        <h3 class="text-blue-400 font-bold mb-2">准入红线 (Redline)</h3>
                        <p class="text-gray-300 text-sm">${item.reason}</p>
                    </div>
                    <div>
                        <h3 class="text-green-400 font-bold mb-2">转型锦囊 (Insight)</h3>
                        <p class="text-gray-300 text-sm italic">${item.suggestion}</p>
                    </div>
                `;
            }
        }

        async function fetchTikTok() {
            try {
                const res = await fetch(`${API_BASE}/tiktok/trending`);
                const data = await res.json();
                const grid = document.getElementById('video-grid');
                grid.innerHTML = data.videos.map(v => `
                    <div class="card rounded-2xl overflow-hidden group cursor-pointer" onclick="window.open('${v.video_url}')">
                        <div class="aspect-[9/16] relative bg-cover bg-center" style="background-image: url('${v.cover_url}')">
                            <div class="absolute inset-0 bg-gradient-to-t from-black/80 to-transparent flex flex-col justify-end p-4">
                                <div class="text-xs text-pink-400 font-bold mb-1">${v.author}</div>
                                <div class="text-sm font-bold line-clamp-2">${v.title}</div>
                                <div class="text-xs text-gray-400 mt-2">${v.play_count} views</div>
                            </div>
                        </div>
                    </div>
                `).join('');
            } catch (e) { console.error(e); }
        }

        async function fetchEcom() {
            try {
                const res = await fetch(`${API_BASE}/ecom/trending`);
                const data = await res.json();
                const grid = document.getElementById('ecom-grid');
                grid.innerHTML = Object.entries(data.platforms).map(([region, items]) => `
                    <div class="card p-6 rounded-2xl">
                        <h3 class="text-blue-400 font-bold mb-4 flex items-center gap-2">
                            <span>📍</span> ${region}
                        </h3>
                        <div class="space-y-4">
                            ${items.map(item => `
                                <div class="bg-white/5 p-3 rounded-xl flex items-center gap-3">
                                    <span class="text-2xl">${item.icon}</span>
                                    <div>
                                        <div class="text-sm font-bold">${item.product}</div>
                                        <div class="text-xs text-gray-400">${item.platform} • 增长 ${item.growth}</div>
                                    </div>
                                </div>
                            `).join('')}
                        </div>
                    </div>
                `).join('');
            } catch (e) { console.error(e); }
        }

        function toggleChat() {
            const box = document.getElementById('chat-box');
            box.style.display = box.style.display === 'flex' ? 'none' : 'flex';
        }

        async function sendMessage() {
            const input = document.getElementById('chat-input');
            const msg = input.value;
            if (!msg) return;
            
            const msgs = document.getElementById('chat-messages');
            msgs.innerHTML += `<div class="bg-blue-600/20 p-3 rounded-lg text-right ml-8">${msg}</div>`;
            input.value = "";
            msgs.scrollTop = msgs.scrollHeight;

            const res = await fetch(`${API_BASE}/ai-chat`, {
                method: 'POST',
                headers: {'Content-Type': 'application/json'},
                body: JSON.stringify({message: msg})
            });
            const data = await res.json();
            msgs.innerHTML += `<div class="bg-white/10 p-3 rounded-lg mr-8">${data.reply.replace(/\n/g, '<br>')}</div>`;
            msgs.scrollTop = msgs.scrollHeight;
        }

        fetchMarket();
        fetchTikTok();
        fetchEcom();
        setInterval(fetchMarket, 60000);
    </script>
</body>
</html>
